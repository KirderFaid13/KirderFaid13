<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-label="Nicolás Goray — Full-Stack &amp; Software Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowIndigo" cx="84%" cy="72%" r="52%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Base background & subtle grid -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="280" rx="16" fill="url(#gridPattern)" />
  <rect width="1200" height="280" rx="16" fill="url(#glowCyan)" />
  <rect width="1200" height="280" rx="16" fill="url(#glowIndigo)" />
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#30363d" stroke-width="1.5" />

  <!-- Top left status pill -->
  <rect x="52" y="34" width="470" height="28" rx="14" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="70" cy="48" r="4" fill="#34d399" />
  <text x="84" y="52" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.9" fill="#7dd3fc">INGENIERÍA DE SISTEMAS &amp; DESARROLLO DE SOFTWARE · PERÚ</text>

  <!-- Hero Title & Subtitle -->
  <text x="52" y="114" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc">Hola, soy Nicolás Goray 👋</text>
  <text x="52" y="152" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#94a3b8">Full-Stack &amp; Software Engineer · .NET | Python | TypeScript | Machine Learning</text>

  <!-- Accent Divider -->
  <rect x="52" y="174" width="160" height="3" rx="1.5" fill="url(#accentLine)" />

  <!-- Decorative Code Card (Right Top) -->
  <rect x="824" y="32" width="324" height="148" rx="12" fill="#0b1120" fill-opacity="0.92" stroke="#334155" stroke-width="1" />
  <rect x="824" y="32" width="324" height="28" rx="12" fill="#1e293b" fill-opacity="0.65" />
  <rect x="824" y="48" width="324" height="12" fill="#1e293b" fill-opacity="0.65" />
  <circle cx="844" cy="46" r="4.5" fill="#f87171" />
  <circle cx="860" cy="46" r="4.5" fill="#fbbf24" />
  <circle cx="876" cy="46" r="4.5" fill="#34d399" />
  <text x="896" y="50" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="11" fill="#94a3b8">kirderfaid13.ts</text>

  <text x="844" y="84" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#c084fc">const <tspan fill="#38bdf8">engineer</tspan><tspan fill="#e2e8f0"> = {</tspan></text>
  <text x="860" y="106" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#94a3b8">role: <tspan fill="#34d399">"Full-Stack &amp; ML"</tspan><tspan fill="#e2e8f0">,</tspan></text>
  <text x="860" y="128" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#94a3b8">core: [<tspan fill="#fbbf24">"C# .NET 8"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#fbbf24">"Python"</tspan><tspan fill="#e2e8f0">],</tspan></text>
  <text x="860" y="150" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#94a3b8">focus: <tspan fill="#34d399">"Clean Architecture"</tspan></text>
  <text x="844" y="168" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#e2e8f0">};</text>

  <!-- Bottom Tech Pills -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
    <rect x="52" y="204" width="170" height="34" rx="8" fill="url(#pillFill)" stroke="#334155" stroke-width="1" />
    <circle cx="70" cy="221" r="4" fill="#a855f7" />
    <text x="82" y="226">ASP.NET Core 8 MVC</text>

    <rect x="234" y="204" width="150" height="34" rx="8" fill="url(#pillFill)" stroke="#334155" stroke-width="1" />
    <circle cx="252" cy="221" r="4" fill="#10b981" />
    <text x="264" y="226">FastAPI &amp; Python</text>

    <rect x="396" y="204" width="166" height="34" rx="8" fill="url(#pillFill)" stroke="#334155" stroke-width="1" />
    <circle cx="414" cy="221" r="4" fill="#38bdf8" />
    <text x="426" y="226">React &amp; TypeScript</text>

    <rect x="574" y="204" width="196" height="34" rx="8" fill="url(#pillFill)" stroke="#334155" stroke-width="1" />
    <circle cx="592" cy="221" r="4" fill="#f59e0b" />
    <text x="604" y="226">Scikit-Learn / LightGBM</text>

    <rect x="782" y="204" width="206" height="34" rx="8" fill="url(#pillFill)" stroke="#334155" stroke-width="1" />
    <circle cx="800" cy="221" r="4" fill="#6366f1" />
    <text x="812" y="226">SQL Server &amp; PostgreSQL</text>
  </g>
